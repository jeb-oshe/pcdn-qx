name: Sync upstream IP_API.js

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-ip-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch upstream and add exit IP to subtitle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js -o /tmp/IP_API.upstream.js
          python3 - <<'PY'
          from pathlib import Path

          source = Path("/tmp/IP_API.upstream.js").read_text(encoding="utf-8")
          anchor = 'var subtitle = ISP_ValidCheck(obj["org"] || obj.as);'
          replacement = 'var subtitle = ISP_ValidCheck(obj["org"] || obj.as) + " | " + obj["query"];'
          if source.count(anchor) != 1:
              raise SystemExit("Could not find the expected subtitle line; no update was made.")
          Path("IP_API.js").write_text(source.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Commit update when changed
        shell: bash
        run: |
          git add IP_API.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync upstream IP_API.js"
          git push
